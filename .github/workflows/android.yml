name: Android CI/CD

on:
  push:
    branches:
      - main
  release:
    types: [published, created]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 9.3.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK as Artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0

      - name: Generate Job Summary
        if: always()
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_FILE" ]; then
            SIZE=$(du -h "$APK_FILE" | cut -f1)
            echo "### 📱 الذكي | مدير المهام" >> $GITHUB_STEP_SUMMARY
            echo "✅ تم بناء التطبيق بنجاح" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📦 APK:" >> $GITHUB_STEP_SUMMARY
            echo "- **اسم الملف:** \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
            echo "- **حجم الملف:** $SIZE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ -n "${{ steps.upload-apk.outputs.artifact-url }}" ]; then
              echo "📥 [تحميل تطبيق الذكي | مدير المهام](${{ steps.upload-apk.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "### 📱 الذكي | مدير المهام" >> $GITHUB_STEP_SUMMARY
            echo "❌ لم يتم إيجاد ملف APK" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
